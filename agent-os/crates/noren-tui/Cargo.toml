[package]
name = "noren-tui"
version = "0.1.0"
description = "Noren terminal UI. Reads daemon state over the local IPC socket and renders intent, memory, audit, capabilities, A2A, chain-receipts, and peer-registry views."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "noren-tui"
path = "src/main.rs"

[lib]
name = "noren_tui"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
bs58 = { workspace = true }
noren-a2a = { path = "../noren-a2a" }
noren-audit = { path = "../noren-audit" }
noren-ipc = { path = "../noren-ipc" }
noren-peer-auth = { path = "../noren-peer-auth" }
noren-permissions = { path = "../noren-permissions" }
noren-types = { path = "../noren-types" }
crossterm = { workspace = true }
futures = { workspace = true }
ratatui = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
noren-identity = { path = "../noren-identity" }
tempfile = { workspace = true }
