[package]
name = "noren-manifest"
version = "0.1.0"
description = "Parser and validator for Noren agent.toml manifests. Reads the agent, capabilities, resources, sandbox, settlement, and hermes sections; parses Runtime (python3, node, rust-bin, hermes), NetworkPolicy (off, outbound-https-only, full), SandboxBackend (trusted-local, linux-gvisor), FilesystemPolicy (read-only-package, ephemeral, host), and HermesApprovalPolicy (operator-prompt, auto-deny, auto-once); pins RESERVED_NAMESPACES (intent., memory., identity., tool., agent.) for capability ids; bounds from_path reads at MAX_MANIFEST_BYTES; and surfaces ManifestError::Parse, Io, TooLarge, and Validation."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
noren-types = { path = "../noren-types" }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
