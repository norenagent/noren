[package]
name = "noren"
version = "0.1.0"
description = "Noren CLI for the local daemon. Submits intents and drives memory, capabilities, receipts, chain, audit, tools, A2A, and peer-registry surfaces over the local IPC socket."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "noren"
path = "src/main.rs"

[dependencies]
noren-a2a = { path = "../noren-a2a" }
noren-audit = { path = "../noren-audit" }
noren-ipc = { path = "../noren-ipc" }
noren-manifest = { path = "../noren-manifest" }
noren-memory = { path = "../noren-memory" }
noren-types = { path = "../noren-types" }
noren-mcp = { path = "../noren-mcp" }
noren-peer-auth = { path = "../noren-peer-auth" }
noren-permissions = { path = "../noren-permissions" }
noren-x402 = { path = "../noren-x402" }
anyhow = { workspace = true }
async-trait = { workspace = true }
borsh = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
bs58 = { workspace = true }
tempfile = { workspace = true }

[lints.clippy]
# main.rs keeps its SAP `--json` emitters after `mod tests` so adding them does
# not renumber the name-anchored `main.rs:NNN` citations that the
# validate-*-line-refs.mjs guards pin. clippy 1.96's items_after_test_module
# penalises that deliberate placement; see the comment above those emitters.
items_after_test_module = "allow"
