[package]
name = "norend"
version = "0.1.0"
description = "Noren daemon. Local-first coordination layer for agentic software, exposing intent dispatch, agent runtime, memory, identity, permissions, audit, and settlement over a Unix socket and an HTTP gateway."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "norend"
path = "src/main.rs"

[dependencies]
noren-types = { path = "../noren-types" }
noren-ipc = { path = "../noren-ipc" }
noren-memory = { path = "../noren-memory" }
noren-audit = { path = "../noren-audit" }
noren-attestation = { path = "../noren-attestation" }
noren-budget = { path = "../noren-budget" }
noren-identity = { path = "../noren-identity" }
noren-llm = { path = "../noren-llm" }
noren-manifest = { path = "../noren-manifest" }
noren-mcp = { path = "../noren-mcp" }
noren-a2a = { path = "../noren-a2a" }
noren-peer-auth = { path = "../noren-peer-auth" }
noren-permissions = { path = "../noren-permissions" }
noren-router = { path = "../noren-router" }
noren-runtime = { path = "../noren-runtime" }
noren-settlement = { path = "../noren-settlement" }
noren-x402 = { path = "../noren-x402", features = ["evm-rpc"] }
noren-acedata = { path = "../noren-acedata" }
noren-robinhood = { path = "../noren-robinhood" }
noren-tee = { path = "../noren-tee" }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = "0.22"
bs58 = { workspace = true }
ed25519-dalek = { workspace = true }
dotenvy = "0.15"
futures = { workspace = true }
getrandom = "0.2"
hex = "0.4"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
noren-audit = { path = "../noren-audit" }
noren-identity = { path = "../noren-identity" }
noren-llm = { path = "../noren-llm" }
noren-manifest = { path = "../noren-manifest" }
noren-peer-auth = { path = "../noren-peer-auth" }
noren-permissions = { path = "../noren-permissions" }
noren-sdk = { path = "../noren-sdk" }
reqwest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
# test-util enables `#[tokio::test(start_paused = true)]` so the SSE
# heartbeat test can advance virtual time instead of sleeping for 15s.
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
