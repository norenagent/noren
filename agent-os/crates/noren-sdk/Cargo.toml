[package]
name = "noren-sdk"
version = "0.1.0"
description = "Ergonomic async client for building agents against a running norend daemon. Wraps connect, authenticate, and typed request/response round-trips over the Noren IPC protocol so authors never hand-roll a wire frame."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
noren-ipc = { path = "../noren-ipc" }
noren-types = { path = "../noren-types" }
noren-mcp = { path = "../noren-mcp" }
noren-a2a = { path = "../noren-a2a" }
noren-permissions = { path = "../noren-permissions" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
