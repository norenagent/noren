[package]
name = "noren-evm-signer"
version = "0.1.0"
description = "Signs Noren statements as EAS off-chain attestations (EIP-712, zero gas) that Base's trust stack can consume: a dual-signed audit-root VC, and an audit-derived reputation score bound to its non-transferable Robinhood Chain identity PDA. One ecrecover authenticates each. Off-chain only; mainnet broadcast is gated separately."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "noren-evm-signer"
path = "src/main.rs"

[dependencies]
noren-identity = { path = "../noren-identity" }
noren-attestation = { path = "../noren-attestation" }
noren-audit = { path = "../noren-audit" }
k256 = { workspace = true }
sha3 = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
