[package]
name = "noren-permissions"
version = "0.1.0"
description = "Capability-token primitive for Noren. ed25519-signed capabilities with persistent and in-memory stores; revocation tombstones; verify-with-clock for expiry. Grant-time scope validation plus dispatch-time scope predicates for tool.call argument allowlists, before-ms cutoffs, and per-namespace memory, A2A, peer, chain, and audit-purge enforcement."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
noren-types = { path = "../noren-types" }
async-trait = { workspace = true }
bs58 = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_jcs = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
noren-identity = { path = "../noren-identity" }
tempfile = { workspace = true }
