[package]
name = "noren-identity"
version = "0.1.0"
description = "Local ed25519 identity for Noren. Keypair generation, on-disk persistence, signing, and verification — the same key is reused to sign on-chain settlement transactions, so there is no second keypair system."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
noren-types = { path = "../noren-types" }
bs58 = { workspace = true }
ed25519-dalek = { workspace = true }
k256 = { workspace = true }
sha3 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
